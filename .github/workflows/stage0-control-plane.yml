name: Stage 0 control-plane checks

on:
  pull_request:
    paths:
      - ".github/workflows/stage0-control-plane.yml"
      - "docs/stage-0/**"
      - "tests/**"
      - "tools/verify_stage0_control_plane.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stage0-control-plane.yml"
      - "docs/stage-0/**"
      - "tests/**"
      - "tools/verify_stage0_control_plane.py"

permissions:
  contents: read

concurrency:
  group: stage0-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Stage 0 governance invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run defensive unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify Stage 0 status integrity
        run: python tools/verify_stage0_control_plane.py
